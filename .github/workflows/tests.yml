name: Tests

on:
  push:
    paths-ignore: ["settings.toml", "README.md"]
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check settings file parses
        run: python -c "from radar.filters import load_settings; load_settings('settings.toml')"
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
