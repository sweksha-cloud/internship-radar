name: Radar

on:
  schedule:
    # GitHub drops many scheduled runs when it's busy: an every-3-hours cron was really running
    # 3-4 times a day. So the schedule fires every hour, and the "gate" job below skips the scan
    # unless the last one finished at least MIN_GAP_MINUTES ago. Scans land about every 3 hours
    # even when GitHub drops some of the hourly triggers. Minute 17 avoids the top-of-the-hour rush.
    - cron: "17 * * * *"
  workflow_dispatch: {}   # the "Run workflow" button = manual scan, always runs

permissions:
  contents: write   # save the radar's memory to the radar-state branch
  pages: write      # publish the page
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  # Decides whether this run scans: manual runs always do; scheduled runs only when the last
  # scan (the radar-state branch's last commit) is at least MIN_GAP_MINUTES old.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      scan: ${{ steps.check.outputs.scan }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          MIN_GAP_MINUTES: "170"
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "scan=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          last=$(gh api "repos/${{ github.repository }}/commits/radar-state" --jq .commit.committer.date 2>/dev/null || true)
          if [ -z "$last" ]; then echo "scan=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          age=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 60 ))
          echo "Last scan finished $age minutes ago"
          if [ "$age" -ge "$MIN_GAP_MINUTES" ]; then echo "scan=true" >> "$GITHUB_OUTPUT"; else echo "scan=false" >> "$GITHUB_OUTPUT"; fi

  scan:
    needs: gate
    if: needs.gate.outputs.scan == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Load what the radar has already seen
        run: |
          mkdir -p state
          if git ls-remote --exit-code --heads origin radar-state >/dev/null 2>&1; then
            git fetch --depth 1 origin radar-state
            git archive FETCH_HEAD | tar -x -C state
          fi

      - name: Scan
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m radar --state state --site site

      - name: Save what the radar has seen
        run: |
          cd state
          git init -q -b radar-state
          git add -A
          git -c user.name="radar-bot" -c user.email="radar-bot@users.noreply.github.com" commit -qm "radar state ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" radar-state

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
